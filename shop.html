        body { background-color: #faf7f2; scroll-behavior: smooth; }

        /* Wishlist Heart Animation */
        .heart-btn { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .heart-btn.active i { font-weight: 900; color: #8b1e0f; transform: scale(1.2); }
        .heart-btn:hover i { transform: scale(1.1); }
        .heart-btn:active i { transform: scale(0.9); }

        /* Toast Animation */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

    <!-- UI & Core Logic -->
    <script>
        // Premium Toast Notification
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-green-500 text-lg"></i>' : '<i class="fa-solid fa-heart text-primary text-lg"></i>';
            
            toast.className = 'bg-white border border-gray-100 shadow-[0_10px_30px_rgba(0,0,0,0.1)] p-4 rounded-xl flex items-center gap-3 toast-enter pointer-events-auto min-w-[280px]';
            toast.innerHTML = `${icon} <span class="font-bold text-sm text-gray-800">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Global Add to Cart
        window.addToCart = function(id, name, price, emoji) {
            let cart = JSON.parse(localStorage.getItem("chulha_cart") || "[]");
            let existing = cart.find(item => item.id === id);
            if(existing) { existing.qty += 1; } 
            else { cart.push({ id, name, price: Number(price), emoji, qty: 1 }); }
            
            localStorage.setItem("chulha_cart", JSON.stringify(cart));
            window.dispatchEvent(new Event("chulha-cart-updated"));
            showToast(`${name} added to cart!`, 'success');
        }

        // Global Wishlist Toggle
        window.toggleWishlist = function(id, name, price, emoji, btnElement) {
            let wishlist = JSON.parse(localStorage.getItem("chulha_wishlist") || "[]");
            let index = wishlist.findIndex(item => item.id === id);
            
            if(index >= 0) {
                wishlist.splice(index, 1);
                btnElement.classList.remove('active');
                btnElement.querySelector('i').classList.replace('fa-solid', 'fa-regular');
                showToast(`Removed from Wishlist`);
            } else {
                wishlist.push({ id, name, price: Number(price), emoji });
                btnElement.classList.add('active');
                btnElement.querySelector('i').classList.replace('fa-regular', 'fa-solid');
                showToast(`Saved to Wishlist`, 'heart');
            }
            
            localStorage.setItem("chulha_wishlist", JSON.stringify(wishlist));
            window.dispatchEvent(new Event("chulha-wishlist-updated"));
        }

        // Mobile Filter Drawer Toggle
        function toggleMobileFilters() {
            const sidebar = document.getElementById('filter-sidebar');
            if(sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('fixed', 'inset-0', 'z-[110]', 'overflow-y-auto', 'm-0', 'rounded-none');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('fixed', 'inset-0', 'z-[110]', 'overflow-y-auto', 'm-0', 'rounded-none');
            }
        }
    </script>

    <!-- FIREBASE & FILTER LOGIC -->
    <script type="module">
        import { db, collection, getDocs } from './js/firebase-config.js';

        let allProducts = []; // Save locally for instant filtering
        let currentSearchQuery = "";

        // 1. DUMMY DATA (Fallback if Firebase is empty)
        const dummyProducts = [
            { id: "d1", name: "Premium Copper Bottom Handi Set", category: "Cookware", price: 2499, emoji: "🥘" },
            { id: "d2", name: "Stainless Steel Dinner Set (51 Pcs)", category: "DinnerSet", price: 3200, emoji: "🍽️" },
            { id: "d3", name: "Heavy Duty Mixer Grinder 750W", category: "Mixer", price: 3499, emoji: "🌪️" },
            { id: "d4", name: "Toughened Glass Top Gas Stove (3 Burner)", category: "Stove", price: 4100, emoji: "🔥" },
            { id: "d5", name: "Non-Stick Tawa & Kadhai Combo", category: "Cookware", price: 1299, emoji: "🍳" },
            { id: "d6", name: "Designer Ceramic Plates Set of 6", category: "DinnerSet", price: 899, emoji: "🍛" },
            { id: "d7", name: "Auto Clean Kitchen Chimney", category: "Chimney", price: 11500, emoji: "💨" },
            { id: "d8", name: "Electric Kettle 1.5L", category: "Appliances", price: 750, emoji: "⚡" }
        ];

        async function fetchAndRenderProducts() {
            const grid = document.getElementById('shop-grid');
            
            // Read URL Parameters (e.g., from Header Search or Home Category click)
            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('cat');
            
            // Note: Header component uses 'q' for search
            const searchParam = urlParams.get('q') || urlParams.get('search');

            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                
                if(!querySnapshot.empty) {
                    querySnapshot.forEach((doc) => {
                        allProducts.push({ id: doc.id, ...doc.data() });
                    });
                } else {
                    // Fallback to Dummy if Firebase is completely empty
                    allProducts = dummyProducts;
                }

                // Apply URL params to UI
                if (catParam) {
                    const catRadio = document.querySelector(`input[name="cat"][value="${catParam}"]`);
                    if(catRadio) catRadio.checked = true;
                    document.getElementById('breadcrumb-category').classList.remove('hidden');
                    document.getElementById('breadcrumb-cat-name').innerText = catParam;
                }
                if (searchParam) {
                    currentSearchQuery = searchParam.toLowerCase();
                    document.getElementById('search-info').classList.remove('hidden');
                    document.getElementById('search-term-display').innerText = searchParam;
                }

                // Trigger Initial Filter
                applyFilters();

            } catch (error) {
                console.error("Firebase error, using dummy data:", error);
                allProducts = dummyProducts;
                applyFilters();
            }
        }

        // 2. LIVE FILTER FUNCTION
        window.applyFilters = function() {
            const grid = document.getElementById('shop-grid');
            const emptyState = document.getElementById('empty-state');
            
            // Get selected values
            const selectedCat = document.querySelector('input[name="cat"]:checked').value;
            const selectedPrice = document.querySelector('input[name="price"]:checked').value;
            const wishlist = JSON.parse(localStorage.getItem("chulha_wishlist") || "[]");

            // Filter logic
            let filteredProducts = allProducts.filter(p => {
                let catMatch = (selectedCat === 'All') || (p.category === selectedCat);
                
                let priceMatch = true;
                if(selectedPrice === 'under999') priceMatch = p.price < 999;
                else if(selectedPrice === '1000to3000') priceMatch = p.price >= 999 && p.price <= 3000;
                else if(selectedPrice === 'over3000') priceMatch = p.price > 3000;

                let searchMatch = true;
                if(currentSearchQuery !== "") {
                    searchMatch = p.name.toLowerCase().includes(currentSearchQuery) || 
                                  (p.category && p.category.toLowerCase().includes(currentSearchQuery));
                }

                return catMatch && priceMatch && searchMatch;
            });

            // Update Desktop Breadcrumb & Mobile Count
            if(selectedCat !== 'All') {
                document.getElementById('breadcrumb-category').classList.remove('hidden');
                document.getElementById('breadcrumb-cat-name').innerText = selectedCat;
            } else {
                document.getElementById('breadcrumb-category').classList.add('hidden');
            }
            
            const countDisplay = document.getElementById('mobile-result-count');
            if(countDisplay) {
                countDisplay.innerText = `Showing ${filteredProducts.length} product${filteredProducts.length !== 1 ? 's' : ''}`;
            }

            // Render Exact Premium Cards as index.html
            grid.innerHTML = '';
            
            if(filteredProducts.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                let html = '';
                filteredProducts.forEach((p) => {
                    const mrp = Math.round(p.price * 1.3);
                    const discount = Math.round(((mrp - p.price) / mrp) * 100);
                    const isWishlisted = wishlist.some(w => w.id === p.id);

                    html += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col relative overflow-hidden group hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                            <!-- Discount Tag -->
                            <div class="absolute top-3 left-3 z-10 bg-gold text-ink text-[9px] font-black px-2 py-1 rounded uppercase tracking-wider shadow-sm">${discount}% OFF</div>
                            
                            <!-- Wishlist Button -->
                            <div onclick="toggleWishlist('${p.id}', '${p.name}', ${p.price}, '${p.emoji || '🥘'}', this)" class="heart-btn absolute top-3 right-3 z-10 h-8 w-8 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-400 shadow-sm border border-gray-100 hover:text-primary ${isWishlisted ? 'active' : ''}">
                                <i class="${isWishlisted ? 'fa-solid text-primary' : 'fa-regular'} fa-heart text-[15px]"></i>
                            </div>

                            <!-- Product Image/Emoji -->
                            <a href="product.html?id=${p.id}" class="h-44 sm:h-48 bg-gradient-to-br from-gray-50 to-[#f8f5f0] flex items-center justify-center text-7xl group-hover:scale-105 transition-transform duration-500">
                                ${p.emoji || '🥘'}
                            </a>
                            
                            <!-- Details -->
                            <div class="p-4 sm:p-5 flex flex-col flex-1">
                                <span class="text-[9px] font-extrabold text-gray-500 uppercase tracking-widest mb-1.5">${p.category}</span>
                                <a href="product.html?id=${p.id}" class="font-bold text-gray-900 text-[13px] sm:text-[15px] leading-snug mb-3 line-clamp-2 hover:text-primary transition-colors min-h-[2.5rem]">
                                    ${p.name}
                                </a>
                                
                                <div class="flex items-end gap-2 mb-5 mt-auto">
                                    <span class="font-black text-primary text-lg sm:text-xl leading-none">₹${p.price.toLocaleString('en-IN')}</span>
                                    <span class="text-[11px] font-semibold text-gray-400 line-through leading-none mb-0.5">₹${mrp.toLocaleString('en-IN')}</span>
                                </div>
                                
                                <button onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.emoji || '🥘'}')" class="w-full bg-white border-2 border-primary text-primary py-2.5 rounded-xl text-sm font-bold hover:bg-primary hover:text-white active:scale-[0.97] transition-all flex justify-center items-center gap-2 group-hover:shadow-md">
                                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            }
        }

        // 3. CLEAR SEARCH & FILTERS
        window.clearSearch = function() {
            currentSearchQuery = "";
            document.getElementById('search-info').classList.add('hidden');
            
            // Clean URL
            const url = new URL(window.location);
            url.searchParams.delete('q');
            url.searchParams.delete('search');
            window.history.pushState({}, '', url);
            
            applyFilters();
        }

        window.clearAllFilters = function() {
            document.querySelector('input[name="cat"][value="All"]').checked = true;
            document.querySelector('input[name="price"][value="all"]').checked = true;
            clearSearch();
        }

        // Initialize on page load
        fetchAndRenderProducts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chulha Ghar - Premium Kitchen Essentials in Deoghar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#8b1e0f', primaryDark: '#64150c', gold: '#d4af37', bgLight: '#faf7f2', ink: '#1a1a1a' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #1a1a1a; scroll-behavior: smooth; } /* Dark bg behind wrapper for parallax */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Wishlist Heart Animation */
        .heart-btn { transition: all 0.2s ease; cursor: pointer; }
        .heart-btn.active i { font-weight: 900; color: #8b1e0f; transform: scale(1.15); }
        .heart-btn:hover i { color: #8b1e0f; transform: scale(1.1); }
    </style>

    <!-- ⚠️ IMPORTING OUR CUSTOM COMPONENTS ⚠️ -->
    <script src="js/components.js" defer></script>

</head>
<body class="text-ink antialiased">

    <!-- 1. JADOO: Bas ek tag se pura Header, Menu, Search, aur Animations aayenge! -->
    <app-header></app-header>

    <!-- 2. MAIN WRAPPER (Zaroori hai Parallax Footer ke liye) -->
    <div id="main-wrapper" class="relative z-10 bg-bgLight shadow-[0_20px_50px_rgba(0,0,0,0.7)] min-h-screen pb-10 transition-all bg-white">

        <!-- HERO SECTION -->
        <section class="relative bg-cover bg-center py-16 md:py-24 lg:py-32" style="background-image: url('hero-bg.jpg');">
            <!-- Fade Overlay -->
            <div class="absolute inset-0 bg-white/90 sm:bg-gradient-to-r sm:from-white/95 sm:via-white/80 sm:to-transparent"></div>
            
            <div class="container mx-auto px-4 lg:px-8 relative z-10">
                <div class="max-w-2xl">
                    <span class="inline-block bg-white/90 backdrop-blur text-primary text-[10px] sm:text-xs font-extrabold px-3 py-1.5 border border-primary/20 rounded shadow-sm tracking-[0.2em] uppercase mb-4">
                        Quality First • Premium Range
                    </span>
                    <h2 class="font-serif text-4xl sm:text-5xl md:text-6xl font-black text-gray-900 leading-[1.1] mb-5 drop-shadow-sm">
                        Design Your Dream <br>
                        <span class="text-primary italic">Kitchen Today.</span>
                    </h2>
                    <p class="text-gray-700 text-sm sm:text-base md:text-lg font-medium max-w-xl mb-8 leading-relaxed">
                        Experience the finest collection of luxury cookware, elegant dining sets, high-tech appliances, and everyday kitchen essentials at Chulha Ghar, Deoghar.
                    </p>
                    <div class="flex flex-wrap gap-4">
                        <a href="shop.html" class="bg-primary text-white px-8 py-3.5 rounded-lg shadow-[0_8px_20px_rgba(139,30,15,0.3)] font-bold hover:-translate-y-1 hover:shadow-[0_12px_25px_rgba(139,30,15,0.4)] transition-all">
                            Shop Collection <i class="fa-solid fa-arrow-right ml-2"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- DYNAMIC PRODUCTS SECTION -->
        <section class="py-16">
            <div class="container mx-auto px-4 lg:px-8">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="font-serif text-3xl sm:text-4xl font-bold text-gray-900 mb-2">Bestsellers</h2>
                        <div class="h-1 w-20 bg-primary rounded-full"></div>
                    </div>
                    <a href="shop.html" class="text-sm font-bold text-primary hover:text-gold transition-colors flex items-center gap-2">View All <i class="fa-solid fa-arrow-right"></i></a>
                </div>
                
                <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                    <p class="col-span-full py-10 text-center text-gray-500 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading Premium Products...</p>
                </div>
            </div>
        </section>

    </div> 
    <!-- MAIN WRAPPER ENDS -->

    <!-- 3. JADOO: Bas ek tag se pura Parallax Footer aayega! -->
    <app-footer></app-footer>

    <!-- Global UI Scripts (Toasts and Add to Cart) -->
    <!-- Ye functions har page par chahiye honge isliye isko yahi rakha hai -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    
    <script>
        // Custom Premium Toast Notification
        window.showToast = function(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-white border-l-4 border-primary shadow-xl px-4 py-3 rounded text-sm font-bold transform translate-x-full transition-transform duration-300 pointer-events-auto flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-check-circle text-primary"></i> ${message}`;
            container.appendChild(toast);
            
            // Slide in
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            
            // Slide out & remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Add to Cart Global Function
        window.addToCart = function(id, name, price, emoji) {
            let cart = JSON.parse(localStorage.getItem("chulha_cart") || "[]");
            let existing = cart.find(item => item.id === id);
            if(existing) existing.qty += 1;
            else cart.push({ id, name, price: Number(price), emoji, qty: 1 });
            
            localStorage.setItem("chulha_cart", JSON.stringify(cart));
            window.dispatchEvent(new Event("chulha-cart-updated")); // Tells Header to update number!
            showToast(`${name} added to cart!`);
        }

        // Toggle Wishlist Global Function
        window.toggleWishlist = function(id, name, price, emoji, btnElement) {
            let wishlist = JSON.parse(localStorage.getItem("chulha_wishlist") || "[]");
            let index = wishlist.findIndex(item => item.id === id);
            
            if(index >= 0) {
                // Remove
                wishlist.splice(index, 1);
                btnElement.classList.remove('active');
                btnElement.querySelector('i').classList.replace('fa-solid', 'fa-regular');
                showToast(`${name} removed from wishlist.`);
            } else {
                // Add
                wishlist.push({ id, name, price: Number(price), emoji });
                btnElement.classList.add('active');
                btnElement.querySelector('i').classList.replace('fa-regular', 'fa-solid');
                showToast(`${name} saved to wishlist!`);
            }
            
            localStorage.setItem("chulha_wishlist", JSON.stringify(wishlist));
            window.dispatchEvent(new Event("chulha-wishlist-updated")); // Tells Header to update number!
        }
    </script>

    <!-- Firebase Logic to load products -->
    <script type="module">
        import { db, collection, getDocs } from './js/firebase-config.js';

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    grid.innerHTML = `<p class="col-span-full text-center py-10 font-bold text-gray-500">Go to <a href="admin.html" class="text-primary underline">Admin Panel</a> to add products.</p>`;
                    return;
                }
                
                const wishlist = JSON.parse(localStorage.getItem("chulha_wishlist") || "[]");

                let html = '';
                // Sirf 8 product dikhayenge homepage par
                let count = 0;
                querySnapshot.forEach((doc) => {
                    if(count >= 8) return; 
                    const p = doc.data();
                    const mrp = Math.round(p.price * 1.3);
                    const discount = Math.round(((mrp - p.price) / mrp) * 100);
                    const wishActive = wishlist.some(w => w.id === doc.id);

                    html += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col relative overflow-hidden group hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                            <div class="absolute top-3 left-3 z-10 bg-gold text-ink text-[10px] font-bold px-2.5 py-1 rounded shadow-sm">${discount}% OFF</div>
                            
                            <!-- Wishlist Heart -->
                            <div onclick="toggleWishlist('${doc.id}', '${p.name}', ${p.price}, '${p.emoji}', this)" class="heart-btn absolute top-3 right-3 z-10 h-8 w-8 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-400 shadow-sm ${wishActive ? 'active' : ''}">
                                <i class="${wishActive ? 'fa-solid' : 'fa-regular'} fa-heart text-[15px]"></i>
                            </div>

                            <a href="#" class="h-44 sm:h-52 bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center text-7xl group-hover:scale-105 transition-transform duration-500">
                                ${p.emoji}
                            </a>
                            
                            <div class="p-4 sm:p-5 flex flex-col flex-1">
                                <span class="text-[9px] sm:text-[10px] font-extrabold text-primary uppercase tracking-widest mb-1.5">${p.category}</span>
                                <a href="#" class="font-bold text-gray-900 text-sm sm:text-[15px] leading-snug mb-3 line-clamp-2 hover:text-primary transition-colors min-h-[2.5rem]">
                                    ${p.name}
                                </a>
                                <div class="flex items-center gap-2.5 mb-5 mt-auto">
                                    <span class="font-black text-primary text-lg sm:text-xl">₹${p.price.toLocaleString('en-IN')}</span>
                                    <span class="text-xs font-semibold text-gray-400 line-through">₹${mrp.toLocaleString('en-IN')}</span>
                                </div>
                                <button onclick="addToCart('${doc.id}', '${p.name}', ${p.price}, '${p.emoji}')" class="w-full bg-white border-2 border-primary text-primary py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-primary hover:text-white active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                                    <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
                    count++;
                });
                grid.innerHTML = html;
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500">Error loading products. Check console.</p>`;
            }
        }
        loadProducts();
    </script>
</body>
</html>
